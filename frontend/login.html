<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10265c">
  <title>Sign in - PGPC SmartGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="sg-header"><div class="container" style="max-width:420px">
    <div class="sg-brand"><span class="sg-mark" aria-hidden="true">PGPC</span>
      <div><h1 class="sg-title">SmartGuide</h1><p class="sg-subtitle">Administrator sign in</p></div></div>
  </div></header>
  <main class="container sg-main" style="max-width:420px">
    <form id="loginForm" class="card card-body p-4" novalidate>
      <label class="form-label" for="username">Username or email</label>
      <input id="username" class="form-control mb-3" autocomplete="username" required>
      <label class="form-label" for="password">Password</label>
      <input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
      <div id="loginError" class="text-danger small mb-2" role="alert"></div>
      <button class="btn sg-send" type="submit">Sign in</button>
    </form>
    <p class="mt-3"><a href="index.html">Back to chatbot</a></p>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
