<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10265c">
  <title>Admin - PGPC SmartGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>
  <header class="sg-header"><div class="container-xl d-flex justify-content-between align-items-center">
    <div class="sg-brand"><span class="sg-mark" aria-hidden="true">PGPC</span>
    <div><h1 class="sg-title">SmartGuide admin</h1>
    <p id="adminWho" class="sg-subtitle">Checking access...</p></div></div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="index.html">Open chatbot</a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Sign out</button>
    </div>
  </div></header>

  <div class="container-xl sg-admin">
    <nav id="nav" class="sg-nav" aria-label="Admin sections"></nav>
    <main>
      <div id="flash" role="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>
  </div>

  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="modalTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
